name: touno

services:
  web:
    build:
      context: ..
      dockerfile: apps/frontend/web/Dockerfile
      target: dev
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '4200:4200'
    volumes:
      - ..:/touno
      - touno_node_modules:/touno/node_modules
      - touno_web_node_modules:/touno/apps/frontend/web/node_modules

volumes:
  touno_node_modules:
  touno_web_node_modules:
