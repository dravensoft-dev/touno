<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Carta"
    subtitle="Categorías, precios y qué está disponible ahora mismo."
  >
    <div actions>
      <arena-button icon="ph-bold ph-plus">Nueva categoría</arena-button>
    </div>
  </arena-page-head>

  <arena-tabs [defaultValue]="categories()[0]">
    @for (category of categories(); track category) {
      <arena-tab [value]="category" [label]="category">
        <arena-table [label]="'Productos de ' + category" [columns]="columns">
          @for (item of itemsIn(category); track item.id) {
            <tr arena-table-row>
              <td arena-table-cell>{{ item.name }}</td>
              <td arena-table-cell>
                <span class="arena-num">{{ item.price }}</span>
              </td>
              <td arena-table-cell>
                <span class="arena-num">{{ item.soldThisMonth }}</span>
              </td>
              <td arena-table-cell>
                <arena-switch
                  [label]="'Disponibilidad de ' + item.name"
                  [state]="item.available"
                  (requestChange)="toggle(item.id, !item.available)"
                />
              </td>
              <td arena-table-cell>
                <arena-icon-button
                  icon="ph-bold ph-pencil-simple"
                  [label]="'Editar ' + item.name"
                  (click)="edit(item.id)"
                />
              </td>
            </tr>
          }
        </arena-table>
      </arena-tab>
    }
  </arena-tabs>
</div>
