<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Métricas"
    subtitle="Qué se vendió, cuánto entró y qué plato sostiene la carta."
  />

  <arena-segmented-control
    ariaLabel="Rango de tiempo"
    [options]="ranges"
    [value]="range()"
    (change)="range.set($event)"
  />

  <arena-grid>
    <arena-stat-card icon="ph-bold ph-wallet" label="Ventas" [value]="sales()" />
    <arena-stat-card icon="ph-bold ph-receipt" label="Ticket promedio" [value]="ticket()" />
    <arena-stat-card icon="ph-bold ph-tray" label="Pedidos" [value]="count()" />
    <arena-stat-card icon="ph-fill ph-star" label="Puntaje" [value]="rating()" tone="success" />
  </arena-grid>

  <arena-chart-card title="Ventas de la semana">
    <arena-line-chart
      label="Ventas por día de la semana en bolivianos"
      [labels]="days"
      [series]="salesSeries"
    />
  </arena-chart-card>

  <arena-chart-card title="Lo más vendido">
    <arena-horizontal-bar-chart
      label="Unidades vendidas por producto"
      [labels]="topLabels()"
      [series]="topSeries()"
    />
  </arena-chart-card>

  <arena-chart-card title="Mezcla por categoría">
    <arena-doughnut-chart
      label="Participación de cada categoría en las ventas"
      [labels]="mixLabels()"
      [series]="mixSeries()"
    />
  </arena-chart-card>
</div>
