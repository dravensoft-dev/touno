<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Reseñas"
    subtitle="Lo que dicen tus compradores, y lo que les respondes."
  />

  <arena-grid>
    <arena-stat-card icon="ph-fill ph-star" label="Puntaje" [value]="rating()" tone="success" />
    <arena-stat-card icon="ph-bold ph-chat-circle" label="Reseñas" [value]="count()" />
    <arena-stat-card
      icon="ph-bold ph-arrow-bend-up-left"
      label="Respondidas"
      [value]="answered()"
    />
  </arena-grid>

  <arena-chart-card title="Distribución de puntajes">
    <arena-horizontal-bar-chart
      label="Cantidad de reseñas por puntaje"
      [labels]="distributionLabels"
      [series]="distribution"
    />
  </arena-chart-card>

  @if (reviewed().length > 0) {
    @for (order of reviewed(); track order.code) {
      <arena-card [title]="order.buyer.name" [eyebrow]="order.stars" headingLevel="h2">
        <p>{{ order.review?.text }}</p>
        <div class="arena-row">
          <arena-tag tone="neutral">{{ order.code }}</arena-tag>
          <arena-tag tone="neutral">{{ order.when }}</arena-tag>
        </div>

        @if (order.review?.reply; as reply) {
          <p class="reviews__reply">{{ reply }}</p>
        } @else {
          <div class="arena-stack">
            <arena-textarea
              [label]="'Responder a ' + order.buyer.name"
              placeholder="Una respuesta corta y sin excusas funciona mejor."
              [value]="draftOf(order.slug)"
              (change)="write(order.slug, $event)"
            />
            <div class="arena-row">
              <arena-button
                variant="ghost"
                icon="ph-bold ph-paper-plane-tilt"
                (click)="reply(order.slug)"
              >
                Responder
              </arena-button>
            </div>
          </div>
        }
      </arena-card>
    }
  } @else {
    <arena-empty-state
      icon="ph-bold ph-star"
      title="Todavía no hay reseñas"
      message="Aparecen en cuanto un pedido se entrega y el comprador puntúa."
    />
  }
</div>
