<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Ajustes del restaurante"
    subtitle="Lo que decide si te llegan pedidos y con cuánto tiempo."
  />

  <div class="arena-stack">
    <arena-switch
      label="Restaurante abierto"
      [state]="merchant()?.open ?? false"
      [confirm]="true"
      (requestChange)="toggleOpen()"
    />

    <arena-switch
      label="Aceptar pedidos automáticamente"
      [state]="acceptsAuto()"
      (requestChange)="acceptsAuto.set(!acceptsAuto())"
    />

    <arena-select
      label="Tiempo de preparación por defecto"
      [options]="prepOptions"
      [value]="prep()"
      (change)="prep.set($event)"
    />

    <arena-input label="Dirección de recojo" [value]="merchant()?.zone ?? ''" />
  </div>

  <arena-key-value [rows]="facts()" />
</div>
