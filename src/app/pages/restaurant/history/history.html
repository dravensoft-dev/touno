<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Historial de pedidos"
    subtitle="Todo lo que ya salió de la cocina, con su desenlace."
  />

  <arena-segmented-control
    ariaLabel="Filtrar historial"
    [options]="filters"
    [value]="filter()"
    (change)="filter.set($event)"
  />

  @if (rows().length > 0) {
    <arena-table label="Historial de pedidos del restaurante" [columns]="columns">
      @for (row of rows(); track row.code) {
        <tr arena-table-row>
          <td arena-table-cell>{{ row.code }}</td>
          <td arena-table-cell>{{ row.buyer.name }}</td>
          <td arena-table-cell><app-status-tag [order]="row.state" /></td>
          <td arena-table-cell>
            <span class="arena-num">{{ row.placed }}</span>
          </td>
          <td arena-table-cell>
            <span class="arena-num">{{ row.total }}</span>
          </td>
        </tr>
      }
    </arena-table>
  } @else {
    <arena-empty-state
      headingLevel="h2"
      icon="ph-bold ph-clock-counter-clockwise"
      title="Nada en este filtro"
      message="Cambia el filtro para ver otros pedidos."
    />
  }
</div>
