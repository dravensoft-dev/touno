<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Cuenta y cobros"
    subtitle="Lo que el Excel sí hacía bien: cuánto se gastó y qué falta cobrar."
  />

  <arena-segmented-control
    ariaLabel="Periodo"
    [options]="periods"
    [value]="period()"
    (change)="pick($event)"
  />

  <arena-grid>
    <arena-stat-card icon="ph-bold ph-package" label="Envíos" [value]="count()" />
    <arena-stat-card icon="ph-bold ph-wallet" label="Gastado" [value]="spent()" />
    <arena-stat-card
      icon="ph-bold ph-hand-coins"
      label="Por cobrar al recoger"
      [value]="toCollect()"
      tone="warning"
    />
    <arena-stat-card
      icon="ph-bold ph-check-circle"
      label="Entregados a tiempo"
      [value]="onTime()"
      tone="success"
    />
  </arena-grid>

  <arena-chart-card title="Destinos frecuentes">
    <arena-horizontal-bar-chart
      label="Envíos por ciudad de destino"
      [labels]="chartLabels()"
      [series]="chartSeries()"
    />
  </arena-chart-card>

  <arena-table label="Movimientos del periodo" [columns]="columns">
    @for (row of rows(); track row.slug) {
      <tr arena-table-row>
        <td arena-table-cell>{{ row.guia }}</td>
        <td arena-table-cell>{{ row.destination.city }}</td>
        <td arena-table-cell><app-status-tag [shipment]="row.state" /></td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.created }}</span>
        </td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.total }}</span>
        </td>
      </tr>
    }
  </arena-table>

  <div class="arena-row">
    <arena-button variant="ghost" icon="ph-bold ph-file-arrow-down">
      Descargar detalle del mes
    </arena-button>
  </div>
</div>
