<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Catálogo publicado"
    subtitle="Lo que tus compradores ven en la tienda. Cada compra sale como encomienda con su guía."
  />

  <arena-table label="Artículos publicados por la importadora" [columns]="columns">
    @for (row of rows(); track row.id) {
      <tr arena-table-row>
        <td arena-table-cell>{{ row.name }}</td>
        <td arena-table-cell>{{ row.category }}</td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.price }}</span>
        </td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.soldThisMonth }}</span>
        </td>
        <td arena-table-cell>
          <arena-switch
            [label]="'Disponibilidad de ' + row.name"
            [state]="row.available"
            (requestChange)="toggle(row.id, !row.available)"
          />
        </td>
      </tr>
    }
  </arena-table>
</div>
