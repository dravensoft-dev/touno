<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    [title]="offer().businessName"
    subtitle="Oferta de contratación por carreras"
  />

  <arena-key-value [rows]="facts()" [total]="total()" />

  @if (offer().state === 'aceptada') {
    <arena-progress-bar
      label="Carreras usadas de la contratación"
      [progressPercentage]="progress()"
      [showPercentage]="true"
    />
  }

  @if (offer().state === 'pendiente') {
    <div class="arena-row">
      <arena-button size="lg" icon="ph-bold ph-check" (click)="accept()">
        Aceptar la contratación
      </arena-button>
      <arena-button variant="danger" size="lg" icon="ph-bold ph-x" (click)="reject()">
        Rechazar
      </arena-button>
    </div>
  }
</div>
