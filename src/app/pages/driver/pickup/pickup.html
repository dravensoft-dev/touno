<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Verificá el paquete"
    subtitle="Paso 1 de 2 · en el punto de recojo"
  />

  <arena-key-value [rows]="facts()" />

  <arena-figure caption="Foto del paquete">
    <i fallback class="ph ph-camera" aria-hidden="true"></i>
  </arena-figure>

  @if (!ride().photoTaken) {
    <arena-alert tone="warning" title="La foto es obligatoria antes de salir">
      Es la prueba que hoy nadie tiene cuando algo se pierde.
    </arena-alert>
  }

  <div class="arena-row">
    <arena-button variant="ghost" icon="ph-bold ph-camera" (click)="takePhoto()">
      Tomar foto
    </arena-button>
    <arena-button variant="danger" icon="ph-bold ph-scales">El peso no coincide</arena-button>
  </div>

  <arena-button size="lg" icon="ph-bold ph-truck" [disabled]="!ride().photoTaken" (click)="next()">
    Recogido, voy a sucursal
  </arena-button>
</div>
