<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Contratar conductores"
    subtitle="Busca entre todos los conductores de la red y ofréceles un número de carreras. La contratación corre cuando el conductor acepta."
  />

  <div class="arena-stack">
    <arena-input
      type="search"
      label="Buscar conductor"
      icon="ph-bold ph-magnifying-glass"
      placeholder="Nombre o placa"
      [value]="term()"
      (change)="search($event)"
    />
    <arena-segmented-control
      ariaLabel="Filtrar por zona"
      [options]="zoneOptions()"
      [value]="zone()"
      (change)="pickZone($event)"
    />
  </div>

  @if (results().length > 0) {
    <arena-people-list label="Conductores disponibles en la red">
      @for (driver of results(); track driver.id) {
        <arena-person-row
          [name]="driver.name"
          [secondary]="driver.plate + ' · ' + driver.city + ' · ' + driver.zones.join(', ')"
          [figure]="driver.rating.toString()"
        >
          <div action class="arena-row">
            @if (hiredWith(driver)) {
              <arena-tag tone="success">Contratado</arena-tag>
            } @else if (pendingWith(driver)) {
              <arena-tag tone="warning">Oferta enviada</arena-tag>
            } @else {
              <arena-button variant="ghost" icon="ph-bold ph-handshake" (click)="propose(driver)">
                Contratar
              </arena-button>
            }
            <arena-button variant="ghost" (click)="openProfile(driver)">Ver perfil</arena-button>
          </div>
        </arena-person-row>
      }
    </arena-people-list>
  } @else {
    <arena-empty-state
      headingLevel="h2"
      icon="ph-bold ph-steering-wheel"
      title="Ningún conductor con ese filtro"
      message="Prueba con otra zona o borra la búsqueda."
    />
  }

  <arena-dialog
    [open]="candidate() !== null"
    title="Enviar una oferta de contratación"
    eyebrow="El conductor decide"
    (close)="close()"
  >
    <div class="arena-stack">
      <arena-input
        type="number"
        label="Número de carreras"
        hint="El conductor se compromete a esa cantidad, a la tarifa de abajo."
        [value]="rides().toString()"
        (change)="setRides($event)"
      />
      <arena-key-value [rows]="offerRows()" [total]="offerTotal()" />
    </div>

    <div footer class="arena-row">
      <arena-button variant="ghost" (click)="close()">Cancelar</arena-button>
      <arena-button icon="ph-bold ph-paper-plane-tilt" (click)="send()">Enviar oferta</arena-button>
    </div>
  </arena-dialog>
</div>
