<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    [title]="driver().name"
    [subtitle]="driver().city + ' · ' + driver().plate"
  >
    <div actions>
      <arena-avatar size="lg" [name]="driver().name" />
    </div>
  </arena-page-head>

  <arena-grid>
    <arena-stat-card icon="ph-fill ph-star" label="Puntaje" [value]="rating()" />
    <arena-stat-card icon="ph-bold ph-navigation-arrow" label="Carreras hechas" [value]="rides()" />
    <arena-stat-card icon="ph-bold ph-clock" label="A tiempo" [value]="onTime()" tone="success" />
  </arena-grid>

  <arena-key-value [rows]="facts()" />

  <arena-chart-card title="Carreras por día">
    <arena-bar-chart
      label="Carreras del conductor por día de la semana"
      [labels]="chartLabels()"
      [series]="chartSeries()"
    />
  </arena-chart-card>
</div>
