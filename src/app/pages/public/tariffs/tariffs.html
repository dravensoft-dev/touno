<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    title="Tarifas por ruta"
    subtitle="Precio de encomienda hasta cinco kilos, más el recojo en la ciudad de origen. Un solo cobro."
  />

  <arena-table label="Tarifas de encomienda por ruta" [columns]="columns">
    @for (row of rows(); track row.key) {
      <tr arena-table-row>
        <td arena-table-cell>{{ row.fromCity }}</td>
        <td arena-table-cell>{{ row.toCity }}</td>
        <td arena-table-cell>{{ row.carrier }}</td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.maxKg }} kg</span>
        </td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.freight }}</span>
        </td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.pickup }}</span>
        </td>
        <td arena-table-cell>
          <span class="arena-num">{{ row.hours }} h</span>
        </td>
      </tr>
    }
  </arena-table>
</div>
