<app-structured-data [key]="'list-' + kind()" [schema]="listSchema()" />

<div class="arena-stack arena-stack--section">
  <arena-page-head headingLevel="h1" [title]="title()" [subtitle]="subtitle()" />

  <div class="arena-stack">
    <arena-select
      label="Ciudad"
      icon="ph-bold ph-map-pin"
      [options]="cityOptions()"
      [value]="city()"
      (change)="pickCity($event)"
    />

    <arena-input
      type="search"
      label="Buscar"
      icon="ph-bold ph-magnifying-glass"
      placeholder="Nombre o tipo de comercio"
      [value]="term()"
      (change)="search($event)"
    />
  </div>

  @if (results().length > 0) {
    <arena-grid>
      @for (merchant of results(); track merchant.slug) {
        <app-merchant-card [merchant]="merchant" headingLevel="h2" />
      }
    </arena-grid>
  } @else {
    <arena-empty-state
      headingLevel="h2"
      icon="ph-bold ph-magnifying-glass"
      title="Nada con ese filtro"
      message="Prueba con otra ciudad o borra la búsqueda."
    />
  }
</div>
