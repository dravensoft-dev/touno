<app-structured-data [key]="'tracking-' + guia()" [schema]="schema()" />

<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    [title]="headline()"
    [subtitle]="shipment().guia + ' · ' + shipment().content"
  >
    <div actions>
      <app-status-tag [shipment]="shipment().state" />
    </div>
  </arena-page-head>

  @if (arrived()) {
    <app-pickup-code [code]="shipment().pickupCode" hint="Muéstralo con tu cédula en ventanilla." />
  } @else {
    <arena-figure caption="Último punto conocido">
      <i fallback class="ph ph-map-trifold" aria-hidden="true"></i>
    </arena-figure>
  }

  <app-shipment-timeline [milestones]="shipment().milestones" />

  <arena-key-value [rows]="facts()" />

  @if (owed()) {
    <arena-alert tone="warning" title="Pagas al recoger" actionLabel="Pagar ahora">
      Son {{ total() }} en ventanilla. También puedes pagar por QR y solo mostrar el código.
    </arena-alert>
  }

  <div class="arena-row">
    <arena-button variant="ghost" icon="ph-bold ph-map-pin">Cómo llegar</arena-button>
    <arena-button variant="ghost" icon="ph-bold ph-phone">Llamar a la sucursal</arena-button>
  </div>
</div>
