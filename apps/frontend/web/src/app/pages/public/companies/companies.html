<app-structured-data [key]="'lista-' + type()" [schema]="schema()" />

<div class="arena-stack arena-stack--section">
  <arena-page-head
    headingLevel="h1"
    [title]="restaurant() ? 'Restaurantes' : 'Importadoras'"
    [subtitle]="
      restaurant()
        ? 'Pide a la sucursal que te queda cerca. La comida sale de tu ciudad y llega con un rider que trabaja para ese local.'
        : 'Compra a una importadora de tu ciudad, o de otra si tiene sucursal en la tuya. Eliges si te lo llevan o lo recoges en mostrador.'
    "
  >
    <div actions class="arena-row">
      <arena-select
        label="Ciudad"
        [options]="cities()"
        [value]="city()"
        (change)="pickCity($event)"
      />
      <arena-input
        label="Buscar"
        placeholder="Nombre o zona"
        [value]="term()"
        (change)="onTerm($event)"
      />
    </div>
  </arena-page-head>

  @if (featured().length > 0) {
    <arena-section
      headingLevel="h2"
      eyebrow="Destacado"
      title="Locales que pagaron por aparecer aquí"
      description="Lo decimos porque es lo que es: estas sucursales compraron esta franja con su plan. No adelantan a nadie en la lista de abajo, que sigue ordenada por cumplimiento y las incluye igual."
      rhythm="md"
    >
      <arena-grid>
        @for (branch of featured(); track branch.id) {
          @if (companyOf(branch.id); as company) {
            <app-branch-card
              [branch]="branch"
              [company]="company"
              [cityName]="geography.nameOf(branch.cityId)"
              headingLevel="h3"
            />
          }
        }
      </arena-grid>
    </arena-section>
  }

  @if (branches().length > 0) {
    <arena-grid>
      @for (branch of branches(); track branch.id) {
        @if (companyOf(branch.id); as company) {
          <app-branch-card
            [branch]="branch"
            [company]="company"
            [cityName]="geography.nameOf(branch.cityId)"
            headingLevel="h2"
          />
        }
      }
    </arena-grid>
  } @else {
    <arena-empty-state
      headingLevel="h2"
      icon="ph-bold ph-magnifying-glass"
      title="Nada por aquí"
      message="Prueba con otra ciudad o busca por otro nombre."
    />
  }
</div>
