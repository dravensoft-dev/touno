<arena-site-footer
  [note]="'© ' + year + ' ' + siteName + '. ' + tagline + ' · ' + city + ' · ' + country + '.'"
>
  <div class="footer-column arena-stack">
    <arena-app-logo size="md" [name]="siteName">
      <app-brand-mark mark />
    </arena-app-logo>
    <p class="footer-slogan">Saber dónde está tu pedido, sin llamar a nadie.</p>
  </div>

  <div class="footer-column arena-stack">
    <h2 class="footer-heading">Pedir</h2>
    <ul class="footer-list arena-stack arena-stack--group">
      <li><a routerLink="/restaurantes" class="footer-link">Restaurantes</a></li>
      <li><a routerLink="/tiendas" class="footer-link">Importadoras</a></li>
      <li><a routerLink="/manual/comprador" class="footer-link">Cómo se cobra</a></li>
    </ul>
  </div>

  <div class="footer-column arena-stack">
    <h2 class="footer-heading">Trabajar con Touno</h2>
    <ul class="footer-list arena-stack arena-stack--group">
      <li><a routerLink="/riders" class="footer-link">Maneja con Touno</a></li>
      <li><a routerLink="/ingresar" class="footer-link">Entrar a un panel</a></li>
    </ul>
  </div>

  <div class="footer-column arena-stack">
    <h2 class="footer-heading">Contacto</h2>
    <ul class="footer-list arena-stack arena-stack--group">
      <li>
        <a [href]="whatsapp" rel="noopener" target="_blank" class="footer-link">
          WhatsApp {{ phone }}
        </a>
      </li>
      <li class="footer-line">{{ city }} · {{ country }}</li>
    </ul>
  </div>
</arena-site-footer>
