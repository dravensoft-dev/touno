@if (candidates().length > 0) {
  <arena-people-list [label]="label()">
    @for (candidate of free(); track candidate.rider.id) {
      <arena-person-row
        [name]="candidate.rider.name"
        [secondary]="candidate.secondary"
        [figure]="candidate.figure"
      >
        <arena-button action variant="secondary" (click)="pick(candidate.rider)">
          Asignar
        </arena-button>
      </arena-person-row>
    }

    @for (candidate of busy(); track candidate.rider.id) {
      <arena-person-row
        [name]="candidate.rider.name"
        [secondary]="candidate.secondary + ' · fuera de turno'"
        [figure]="candidate.figure"
      />
    }
  </arena-people-list>
} @else {
  <arena-empty-state
    headingLevel="h3"
    icon="ph-bold ph-handshake"
    title="Ningún rider trabaja con esta sucursal"
    message="Un rider aparece aquí si aceptó un reclutamiento con esta sucursal, o si vino por un llamado de agentes libres y está repartiendo."
  />
}
